[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon_etl"
version = "0.1.0"
description = "ETL pipeline for academic and research data ingestion with Prefect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prefect==3.6.23",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "networkx>=3.4.0",
    "requests>=2.30.0",
    "beautifulsoup4>=4.12.0",
    "infisicalsdk>=1.0.17",
    "openpyxl>=3.1.0",
    "thefuzz>=0.22.0",
    "rapidfuzz>=3.0.0",
    "python-Levenshtein>=0.25.0",
    "python-dotenv>=1.0.0",
    # agent_sigpesq: repositorio oficial do ifesserra-lab, branch main (que ja
    # mergeou a feat/project-pdf-download-and-mistral-extraction). O nome da
    # distribuicao e "agent_sigpesq" -- "sigpesq-agent" faz o pip recusar a
    # instalacao ("inconsistent name: expected 'sigpesq-agent', but metadata has
    # 'agent-sigpesq'"). O extra [extract] traz mistralai e pypdf, exigidos
    # pela extracao PDF->JSON dos documentos de projeto.
    "agent-sigpesq[extract] @ git+https://github.com/ifesserra-lab/sigpesq_agent.git@main",
    "dgp-cnpq-lib @ git+https://github.com/ifesserra-lab/dgp.cnqp_lib.git@v0.5.0",
    "scriptLattes @ git+https://github.com/ifesserra-lab/scriptLattes.git@v0.8.0",
    "selenium>=4.0.0",
    "research-domain @ git+https://github.com/The-Band-Solution/ResearchDomain.git@v0.14.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black==24.10.0",
    "isort==5.13.2",
    "mypy",
    "flake8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
