name: Diagnose SigPesq reachability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # GitHub-HOSTED runner on purpose: this answers whether the portal is
    # reachable from the exact environment the weekly-Etl job uses, without
    # needing any self-hosted runner / tunnel.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGPESQ_USERNAME: ${{ secrets.SIGPESQ_USERNAME }}
      SIGPESQ_USER: ${{ secrets.SIGPESQ_USERNAME }}
      SIGPESQ_PASSWORD: ${{ secrets.SIGPESQ_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create venv and install deps (same as weekly-etl job)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Show egress country (ASN/geo)
        run: |
          echo "country=$(curl -s https://ipinfo.io/country)"
          echo "org=$(curl -s https://ipinfo.io/org)"

      - name: Probe 1 - plain curl to login page
        run: |
          curl -sk -o /dev/null -w "HTTP %{http_code} in %.2fs\n" \
            https://sigpesq.ifes.edu.br/Login.aspx

      - name: Probe 2 - Playwright browser + login (full agent flow)
        run: |
          cat > probe.py <<'EOF'
          import asyncio, os, traceback
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True, args=[
                      "--no-sandbox","--disable-dev-shm-usage","--disable-gpu",
                      "--window-size=1920,1080",
                  ])
                  c = await b.new_context(viewport={"width":1920,"height":1080},
                      user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                        "AppleWebKit/537.36 (KHTML, like Gecko) "
                        "Chrome/120.0.0.0 Safari/537.36"))
                  pg = await c.new_page()
                  shown = []
                  pg.on("response", lambda r: shown.append((r.status, r.url)))
                  try:
                      r = await pg.goto("https://sigpesq.ifes.edu.br/Login.aspx",
                                        timeout=30000, wait_until="load")
                      print("GOTO OK status=", r.status if r else None,
                            "url=", pg.url)
                  except Exception as e:
                      print("GOTO EXC", type(e).__name__, str(e)[:300])
                  print("responses:", shown[:12])
                  await b.close()

          asyncio.run(main())
          EOF
          timeout 90 .venv/bin/python probe.py

      - name: Probe 3 - full agent report download (if creds present)
        if: env.SIGPESQ_USERNAME != '' && env.SIGPESQ_PASSWORD != ''
        run: |
          timeout 180 .venv/bin/python -c "
          import asyncio
          from agent_sigpesq.services.reports_service import SigpesqReportService
          from agent_sigpesq.strategies import ResearchGroupsDownloadStrategy
          async def main():
              svc = SigpesqReportService(headless=True,
                  download_dir='probe_out',
                  strategies=[ResearchGroupsDownloadStrategy()])
              try:
                  print('RUN RESULT:', await svc.run())
              except Exception as e:
                  traceback.print_exc()
          asyncio.run(main())
          "