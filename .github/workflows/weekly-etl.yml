name: Weekly Horizon ETL Flows

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      weekly_campus:
        description: "Optional campus filter. Leave blank to process all campuses."
        required: false
        type: string
      output_dir:
        description: "Output directory for generated exports and reports."
        required: false
        default: "data/exports"
        type: string
      fresh_database:
        description: "Ignore the previous run's database and rebuild from scratch."
        required: false
        default: false
        type: boolean
      refresh_share:
        description: "Share of stored Lattes curricula and CNPq pages downloaded again (0-1; blank = 0.25)."
        required: false
        default: ""
        type: string
      full_refresh:
        description: "Download every Lattes curriculum and CNPq page again."
        required: false
        default: false
        type: boolean
      early_stop:
        description: "Stop downloading from a portal that blocks or stops answering, and use the stored copies."
        required: false
        default: true
        type: boolean
      cnpq_stop_after:
        description: "CNPq failed attempts in a row that stop the downloads (blank = 8; 0 = off)."
        required: false
        default: ""
        type: string
      cnpq_budget_min:
        description: "Minutes of CNPq downloads before they stop (blank = 45; 0 = off)."
        required: false
        default: ""
        type: string
      lattes_stop_after:
        description: "Lattes failures or access check pages in a row that stop the downloads (blank = 5; 0 = off)."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-etl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_TYPE: ${{ secrets.STORAGE_TYPE }}
      SIGPESQ_USERNAME: ${{ secrets.SIGPESQ_USERNAME }}
      SIGPESQ_USER: ${{ secrets.SIGPESQ_USERNAME }}
      SIGPESQ_PASSWORD: ${{ secrets.SIGPESQ_PASSWORD }}
      SIGPESQ_CREDENTIALS_SOURCE: legacy
      HORIZON_PII_HMAC_KEY: ${{ secrets.HORIZON_PII_HMAC_KEY }}
      HORIZON_TELEGRAM_BOT_TOKEN: ${{ secrets.HORIZON_TELEGRAM_BOT_TOKEN }}
      HORIZON_TELEGRAM_CHAT_ID: ${{ secrets.HORIZON_TELEGRAM_CHAT_ID }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      WEEKLY_CAMPUS: ${{ github.event.inputs.weekly_campus }}
      OUTPUT_DIR: ${{ github.event.inputs.output_dir || 'data/exports' }}
      PREFECT_UI_URL: http://127.0.0.1:4200
      CHROME_BINARY: /usr/bin/chromium-browser
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      RAPIDFUZZ_IMPLEMENTATION: fallback
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Install Chromium for Lattes (Selenium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser chromium-driver

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "Missing GitHub secret: DATABASE_URL"; exit 1; }
          test -n "$STORAGE_TYPE" || { echo "Missing GitHub secret: STORAGE_TYPE"; exit 1; }
          test -n "$SIGPESQ_USERNAME" || { echo "Missing GitHub secret: SIGPESQ_USERNAME"; exit 1; }
          test -n "$SIGPESQ_PASSWORD" || { echo "Missing GitHub secret: SIGPESQ_PASSWORD"; exit 1; }
          test -n "$HORIZON_PII_HMAC_KEY" || { echo "Missing GitHub secret: HORIZON_PII_HMAC_KEY"; exit 1; }
          test -n "$MISTRAL_API_KEY" || { echo "Missing GitHub secret: MISTRAL_API_KEY"; exit 1; }

      # Spec 022: start from the database, raw downloads and Lattes cache of
      # the last successful weekly of this branch. Anything missing or broken
      # leaves a rebuild (make weekly-flows -> make db-ensure creates it); the
      # step never fails the run, and the job summary says what happened.
      - name: Restore previous weekly run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_DATABASE: ${{ github.event.inputs.fresh_database }}
        run: make restore-weekly

      - name: Run weekly flows
        env:
          # Spec 023: rotation of the raw downloads (defaults when blank).
          HORIZON_REFRESH_SHARE: ${{ github.event.inputs.refresh_share }}
          HORIZON_FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
          # Spec 024: give a portal up when it blocks (defaults when blank).
          HORIZON_PORTAL_EARLY_STOP: ${{ github.event.inputs.early_stop }}
          HORIZON_CNPQ_STOP_AFTER_FAILURES: ${{ github.event.inputs.cnpq_stop_after }}
          HORIZON_CNPQ_DOWNLOAD_BUDGET_MIN: ${{ github.event.inputs.cnpq_budget_min }}
          HORIZON_LATTES_STOP_AFTER_FAILURES: ${{ github.event.inputs.lattes_stop_after }}
        run: make weekly-flows

      - name: Compress large export files
        if: always()
        run: |
          # Never touch archives: exports_canonical.zip is the flow's own
          # deliverable and must ship byte-for-byte as written by
          # `make weekly-flows` (no double wrapping). data/raw is restored by
          # the next run (spec 022), so its files travel as the phases read
          # them.
          find data/ -type f -size +10M ! -name '*.zip' ! -path 'data/raw/*' \
            -exec sh -c 'for f; do zip -m -j "$f.zip" "$f"; done' sh {} +

      - name: Commit exports_canonical.zip if changed
        if: success()
        run: |
          set -euo pipefail
          ZIP="data/exports/exports_canonical.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::warning::$ZIP was not generated; nothing to commit."
            exit 0
          fi
          git add -- "$ZIP"
          if git diff --cached --quiet; then
            echo "No changes to $ZIP; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(exports_canonical.zip): update from weekly run $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload ETL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-etl-artifacts
          # Spec 022: the next run restores from this artifact; 90 days leave
          # a database to restore after about twelve failed weeklies in a row.
          retention-days: 90
          if-no-files-found: ignore
          path: |
            data
            db/horizon.db
            cache
            !data/exports/exports_canonical.zip
            !.venv
            !.venv/**
            !.env
            !.env.*

      - name: Show Prefect logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop Prefect server
        if: always()
        run: docker compose down -v
